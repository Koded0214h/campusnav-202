spring:
  application:
    name: campusnav-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campusnav}
    username: ${SPRING_DATASOURCE_USERNAME:campusnav}
    password: ${SPRING_DATASOURCE_PASSWORD:campusnav}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema.sql
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

campusnav:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: campusnav-api
    secret: ${JWT_SECRET:replace-this-development-secret-with-at-least-32-bytes}
    ttl: PT12H
  routing:
    mapbox-token: ${MAPBOX_TOKEN:}
